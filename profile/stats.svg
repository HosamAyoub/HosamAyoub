<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="214" viewBox="0 0 1200 214" role="img" aria-label="By the numbers: 15x lower operating cost on a production LLM pipeline; 2,214 GitHub contributions since 2021; 1,144 public commits across 25 repositories; 1st in department for the SOVA graduation project">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="0.55" stop-color="#0f1b30"/><stop offset="1" stop-color="#132a4a"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9cc3ff"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
    .num { font-size: 42px; font-weight: 700; fill: url(#num); }
    .label { font-size: 15px; fill: #9fb3cc; }
  </style>
  <rect width="1200" height="214" rx="18" fill="url(#bg)"/>
  <text x="36" y="46" class="mono" font-size="14" letter-spacing="3" fill="#7ee787">BY THE NUMBERS</text>
  <text x="1164" y="46" text-anchor="end" class="mono" font-size="12" fill="#5b7aa6">GitHub figures refresh daily</text>
  <g transform="translate(36 70)">
    <rect width="264" height="112" rx="12" fill="#111c2e" stroke="#23406b" stroke-width="1.5"/>
    <text x="24" y="56" class="sans num">15x</text>
    <text x="24" y="82" class="sans label">lower operating cost on a</text>
    <text x="24" y="100" class="sans label">production LLM pipeline</text>
  </g>
  <g transform="translate(324 70)">
    <rect width="264" height="112" rx="12" fill="#111c2e" stroke="#23406b" stroke-width="1.5"/>
    <text x="24" y="56" class="sans num">2,214</text>
    <text x="24" y="82" class="sans label">GitHub contributions</text>
    <text x="24" y="100" class="sans label">since 2021</text>
  </g>
  <g transform="translate(612 70)">
    <rect width="264" height="112" rx="12" fill="#111c2e" stroke="#23406b" stroke-width="1.5"/>
    <text x="24" y="56" class="sans num">1,144</text>
    <text x="24" y="82" class="sans label">public commits across</text>
    <text x="24" y="100" class="sans label">25 repositories</text>
  </g>
  <g transform="translate(900 70)">
    <rect width="264" height="112" rx="12" fill="#111c2e" stroke="#23406b" stroke-width="1.5"/>
    <text x="24" y="56" class="sans num">1st</text>
    <text x="24" y="82" class="sans label">in department for the</text>
    <text x="24" y="100" class="sans label">SOVA graduation project</text>
  </g>
</svg>
