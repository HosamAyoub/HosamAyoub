<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="226" viewBox="0 0 1200 226" role="img" aria-label="By the numbers: 15x lower operating cost on a production AI pipeline; 2,330 GitHub contributions since 2021; 1,237 public commits across 26 repositories; 10 programming languages, from Assembly to TypeScript">
  <defs>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9cc3ff"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
    .num { font-size: 46px; font-weight: 700; fill: url(#num); }
    .label { font-size: 18px; fill: #9fb3cc; }
  </style>
  <text x="36" y="46" class="mono" font-size="16" letter-spacing="3" fill="#3fb950">BY THE NUMBERS</text>
  <g transform="translate(36 70)">
    <rect width="264" height="124" rx="12" fill="none" stroke="#23406b" stroke-width="1.5"/>
    <text x="24" y="56" class="sans num">15x</text>
    <text x="24" y="86" class="sans label">lower operating cost on a</text>
    <text x="24" y="108" class="sans label">production AI pipeline</text>
  </g>
  <g transform="translate(324 70)">
    <rect width="264" height="124" rx="12" fill="none" stroke="#23406b" stroke-width="1.5"/>
    <text x="24" y="56" class="sans num">2,330</text>
    <text x="24" y="86" class="sans label">GitHub contributions</text>
    <text x="24" y="108" class="sans label">since 2021</text>
  </g>
  <g transform="translate(612 70)">
    <rect width="264" height="124" rx="12" fill="none" stroke="#23406b" stroke-width="1.5"/>
    <text x="24" y="56" class="sans num">1,237</text>
    <text x="24" y="86" class="sans label">public commits across</text>
    <text x="24" y="108" class="sans label">26 repositories</text>
  </g>
  <g transform="translate(900 70)">
    <rect width="264" height="124" rx="12" fill="none" stroke="#23406b" stroke-width="1.5"/>
    <text x="24" y="56" class="sans num">10</text>
    <text x="24" y="86" class="sans label">programming languages,</text>
    <text x="24" y="108" class="sans label">from Assembly to TypeScript</text>
  </g>
</svg>
