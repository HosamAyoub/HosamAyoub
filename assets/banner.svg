<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Hosam Ayoub, software engineer who loves building solutions. 2021 embedded C and microcontroller drivers, 2023 embedded Linux with SOVA, 2025 full-stack .NET, today LLMs in production.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0f1b30"/>
      <stop offset="1" stop-color="#132a4a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9cc3ff"/>
    </linearGradient>
    <linearGradient id="time" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="1090" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
    .year { font-size: 15px; letter-spacing: 2px; }
    .title { font-size: 18px; font-weight: 600; fill: #e6edf3; }
    .sub { font-size: 14px; fill: #8ea5c2; }
    .node { fill: #111c2e; stroke-width: 2.5; }
    .icon { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pulse { fill: none; stroke: #ffffff; stroke-width: 4; stroke-linecap: round; opacity: .85;
             stroke-dasharray: 40 960; stroke-dashoffset: 1000; animation: travel 5s linear infinite; }
    .ring { fill: none; stroke: #3b82f6; stroke-width: 2; transform-origin: 1010px 200px; animation: ring 2.5s ease-out infinite; }
    @keyframes travel { to { stroke-dashoffset: 0; } }
    @keyframes ring { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.7); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse, .ring { animation: none; } .pulse { opacity: 0; } }
  </style>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- identity -->
  <text x="600" y="78" text-anchor="middle" class="sans" font-size="56" font-weight="700" fill="url(#name)" letter-spacing="1">Hosam Ayoub</text>
  <text x="600" y="114" text-anchor="middle" class="sans" font-size="21" fill="#c9d7ea">Software engineer who loves building solutions</text>

  <!-- the time line -->
  <line x1="110" y1="200" x2="1090" y2="200" stroke="url(#time)" stroke-width="3" opacity=".55"/>
  <path class="pulse" pathLength="1000" d="M110 200 H1010"/>

  <!-- 2021: a chip -->
  <g>
    <text x="170" y="160" text-anchor="middle" class="mono year" fill="#7ee787">2021</text>
    <circle class="node" cx="170" cy="200" r="26" stroke="#7ee787"/>
    <g class="icon" stroke="#7ee787">
      <rect x="160" y="190" width="20" height="20" rx="3"/>
      <path d="M165 186v4M170 186v4M175 186v4M165 210v4M170 210v4M175 210v4M156 195h4M156 205h4M180 195h4M180 205h4"/>
    </g>
    <text x="170" y="252" text-anchor="middle" class="sans title">Embedded C</text>
    <text x="170" y="274" text-anchor="middle" class="sans sub">microcontroller drivers</text>
  </g>

  <!-- 2023: embedded Linux, SOVA glasses -->
  <g>
    <text x="450" y="160" text-anchor="middle" class="mono year" fill="#5fd0a8">2023</text>
    <circle class="node" cx="450" cy="200" r="26" stroke="#5fd0a8"/>
    <g class="icon" stroke="#5fd0a8">
      <circle cx="441" cy="203" r="6"/><circle cx="459" cy="203" r="6"/>
      <path d="M447 203h6M435 203l-3-6M465 203l3-6"/>
    </g>
    <text x="450" y="252" text-anchor="middle" class="sans title">Embedded Linux + ML</text>
    <text x="450" y="274" text-anchor="middle" class="sans sub">SOVA smart glasses, 1st in dept.</text>
  </g>

  <!-- 2025: full-stack .NET -->
  <g>
    <text x="730" y="160" text-anchor="middle" class="mono year" fill="#4fa3f0">2025</text>
    <circle class="node" cx="730" cy="200" r="26" stroke="#4fa3f0"/>
    <g class="icon" stroke="#4fa3f0">
      <path d="M721 193l-7 7 7 7M739 193l7 7-7 7M733 190l-6 20"/>
    </g>
    <text x="730" y="252" text-anchor="middle" class="sans title">Full-Stack .NET</text>
    <text x="730" y="274" text-anchor="middle" class="sans sub">C#, SQL Server, Angular</text>
  </g>

  <!-- today: LLMs in production -->
  <g>
    <text x="1010" y="160" text-anchor="middle" class="mono year" fill="#3b82f6">TODAY</text>
    <circle class="ring" cx="1010" cy="200" r="26"/>
    <circle class="node" cx="1010" cy="200" r="26" stroke="#3b82f6"/>
    <g class="icon" stroke="#3b82f6">
      <path d="M1000 192L1020 200M1000 208L1020 200M1000 192L1010 200M1000 208L1010 200M1010 200H1020"/>
      <circle cx="1000" cy="192" r="3" fill="#3b82f6"/><circle cx="1000" cy="208" r="3" fill="#3b82f6"/><circle cx="1010" cy="200" r="3" fill="#3b82f6"/><circle cx="1020" cy="200" r="3.5" fill="#3b82f6"/>
    </g>
    <text x="1010" y="252" text-anchor="middle" class="sans title">LLMs in production</text>
    <text x="1010" y="274" text-anchor="middle" class="sans sub">Software Engineer @ Z2Data</text>
  </g>
</svg>
