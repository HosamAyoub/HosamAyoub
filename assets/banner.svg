<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Hosam Ayoub, software engineer who loves building solutions. 2021 embedded C and microcontroller drivers, 2023 embedded Linux with SOVA, 2025 full-stack .NET, today LLMs in production.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0f1b30"/>
      <stop offset="1" stop-color="#132a4a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9cc3ff"/>
    </linearGradient>
    <linearGradient id="time" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="1090" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
    .year { font-size: 15px; letter-spacing: 2px; }
    .title { font-size: 18px; font-weight: 600; fill: #e6edf3; }
    .sub { font-size: 14px; fill: #8ea5c2; }
    .node { fill: #111c2e; stroke-width: 2.5; }
    .icon { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .edge { fill: none; stroke: #3a6db0; stroke-width: 1; }
    .neuron { fill: #3b82f6; animation: blink 3s ease-in-out infinite; }
    .neuron.d1 { animation-delay: .4s; } .neuron.d2 { animation-delay: .8s; }
    .neuron.d3 { animation-delay: 1.2s; } .neuron.d4 { animation-delay: 1.6s; }
    .loader { animation: load 8s linear infinite; }
    .arc { fill: none; stroke-width: 3; transform-box: fill-box; transform-origin: center; transform: rotate(-90deg); }
    .ring { fill: none; stroke-width: 2; transform-box: fill-box; transform-origin: center; opacity: 0; }
    @keyframes load {
      0% { transform: translateX(110px); opacity: 0; } 2% { opacity: 1; }
      3%, 13% { transform: translateX(170px); } 28%, 38% { transform: translateX(450px); }
      53%, 63% { transform: translateX(730px); } 78%, 94% { transform: translateX(1010px); opacity: 1; }
      96%, 100% { transform: translateX(1010px); opacity: 0; }
    }
    .arc.s0 { animation: fill0 8s linear infinite; } .ring.s0 { animation: done0 8s ease-out infinite; }
    @keyframes fill0 { 0%, 3% { stroke-dashoffset: 100; opacity: 1; } 13% { stroke-dashoffset: 0; opacity: 1; } 17%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes done0 { 0%, 13% { transform: scale(1); opacity: 0; } 13.1% { transform: scale(1); opacity: .9; } 19%, 100% { transform: scale(1.7); opacity: 0; } }
    .arc.s1 { animation: fill1 8s linear infinite; } .ring.s1 { animation: done1 8s ease-out infinite; }
    @keyframes fill1 { 0%, 28% { stroke-dashoffset: 100; opacity: 1; } 38% { stroke-dashoffset: 0; opacity: 1; } 42%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes done1 { 0%, 38% { transform: scale(1); opacity: 0; } 38.1% { transform: scale(1); opacity: .9; } 44%, 100% { transform: scale(1.7); opacity: 0; } }
    .arc.s2 { animation: fill2 8s linear infinite; } .ring.s2 { animation: done2 8s ease-out infinite; }
    @keyframes fill2 { 0%, 53% { stroke-dashoffset: 100; opacity: 1; } 63% { stroke-dashoffset: 0; opacity: 1; } 67%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes done2 { 0%, 63% { transform: scale(1); opacity: 0; } 63.1% { transform: scale(1); opacity: .9; } 69%, 100% { transform: scale(1.7); opacity: 0; } }
    .arc.s3 { animation: fill3 8s linear infinite; } .ring.s3 { animation: done3 8s ease-out infinite; }
    @keyframes fill3 { 0%, 78% { stroke-dashoffset: 100; opacity: 1; } 94% { stroke-dashoffset: 0; opacity: 1; } 98%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes done3 { 0%, 94% { transform: scale(1); opacity: 0; } 94.1% { transform: scale(1); opacity: .9; } 100%, 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes blink { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .loader, .arc, .ring, .neuron { animation: none; } .loader, .arc { opacity: 0; } }
  </style>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- identity -->
  <text x="600" y="78" text-anchor="middle" class="sans" font-size="56" font-weight="700" fill="url(#name)" letter-spacing="1">Hosam Ayoub</text>
  <text x="600" y="114" text-anchor="middle" class="sans" font-size="21" fill="#c9d7ea">Software engineer who loves building solutions</text>

  <!-- the time line -->
  <line x1="110" y1="200" x2="1090" y2="200" stroke="url(#time)" stroke-width="3" opacity=".55"/>
  <g class="loader"><rect x="-22" y="198" width="44" height="4" rx="2" fill="#ffffff" opacity=".9"/></g>

  <!-- 2021: a chip -->
  <g>
    <text x="170" y="160" text-anchor="middle" class="mono year" fill="#7ee787">2021</text>
    <circle class="ring s0" cx="170" cy="200" r="26" stroke="#7ee787"/>
    <circle class="arc s0" cx="170" cy="200" r="31" stroke="#7ee787" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
    <circle class="node" cx="170" cy="200" r="26" stroke="#7ee787"/>
    <g class="icon" stroke="#7ee787">
      <rect x="160" y="190" width="20" height="20" rx="3"/>
      <path d="M165 186v4M170 186v4M175 186v4M165 210v4M170 210v4M175 210v4M156 195h4M156 205h4M180 195h4M180 205h4"/>
    </g>
    <text x="170" y="252" text-anchor="middle" class="sans title">Embedded C</text>
    <text x="170" y="274" text-anchor="middle" class="sans sub">microcontroller drivers</text>
  </g>

  <!-- 2023: embedded Linux, SOVA glasses -->
  <g>
    <text x="450" y="160" text-anchor="middle" class="mono year" fill="#5fd0a8">2023</text>
    <circle class="ring s1" cx="450" cy="200" r="26" stroke="#5fd0a8"/>
    <circle class="arc s1" cx="450" cy="200" r="31" stroke="#5fd0a8" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
    <circle class="node" cx="450" cy="200" r="26" stroke="#5fd0a8"/>
    <g class="icon" stroke="#5fd0a8">
      <circle cx="441" cy="203" r="6"/><circle cx="459" cy="203" r="6"/>
      <path d="M447 203h6M435 203l-3-6M465 203l3-6"/>
    </g>
    <text x="450" y="252" text-anchor="middle" class="sans title">Embedded Linux + ML</text>
    <text x="450" y="274" text-anchor="middle" class="sans sub">SOVA smart glasses, 1st in dept.</text>
  </g>

  <!-- 2025: full-stack .NET -->
  <g>
    <text x="730" y="160" text-anchor="middle" class="mono year" fill="#4fa3f0">2025</text>
    <circle class="ring s2" cx="730" cy="200" r="26" stroke="#4fa3f0"/>
    <circle class="arc s2" cx="730" cy="200" r="31" stroke="#4fa3f0" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
    <circle class="node" cx="730" cy="200" r="26" stroke="#4fa3f0"/>
    <g class="icon" stroke="#4fa3f0">
      <path d="M721 193l-7 7 7 7M739 193l7 7-7 7M733 190l-6 20"/>
    </g>
    <text x="730" y="252" text-anchor="middle" class="sans title">Full-Stack .NET</text>
    <text x="730" y="274" text-anchor="middle" class="sans sub">C#, SQL Server, Angular</text>
  </g>

  <!-- today: LLMs in production -->
  <g>
    <text x="1010" y="160" text-anchor="middle" class="mono year" fill="#3b82f6">TODAY</text>
    <circle class="ring s3" cx="1010" cy="200" r="26" stroke="#3b82f6"/>
    <circle class="arc s3" cx="1010" cy="200" r="31" stroke="#3b82f6" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
    <circle class="node" cx="1010" cy="200" r="26" stroke="#3b82f6"/>
    <!-- the neural net from the first banner, sized to sit inside the circle -->
    <g class="edge">
      <path d="M996 193L1010 187M996 193L1010 200M996 193L1010 213M996 207L1010 187M996 207L1010 200M996 207L1010 213"/>
      <path d="M1010 187L1024 193M1010 200L1024 193M1010 213L1024 193M1010 187L1024 207M1010 200L1024 207M1010 213L1024 207"/>
    </g>
    <circle class="neuron" cx="996" cy="193" r="2.8"/><circle class="neuron d1" cx="996" cy="207" r="2.8"/>
    <circle class="neuron d2" cx="1010" cy="187" r="2.8"/><circle class="neuron d3" cx="1010" cy="200" r="2.8"/><circle class="neuron d4" cx="1010" cy="213" r="2.8"/>
    <circle class="neuron d1" cx="1024" cy="193" r="2.8"/><circle class="neuron d3" cx="1024" cy="207" r="2.8"/>
    <text x="1010" y="252" text-anchor="middle" class="sans title">LLMs in production</text>
    <text x="1010" y="274" text-anchor="middle" class="sans sub">Software Engineer @ Z2Data</text>
  </g>
</svg>
