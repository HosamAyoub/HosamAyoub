<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Hosam Ayoub, software engineer who loves building solutions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0f1b30"/>
      <stop offset="1" stop-color="#132a4a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9cc3ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#1f3354"/>
    </pattern>
  </defs>

  <style>
    .trace { fill: none; stroke: #23406b; stroke-width: 2; }
    .pulse { fill: none; stroke: #60a5fa; stroke-width: 3; stroke-linecap: round;
             stroke-dasharray: 70 930; stroke-dashoffset: 1000; animation: flow 4.5s linear infinite; }
    .pulse.b { stroke: #7ee787; animation-delay: 2.25s; }
    .via { fill: #0d1117; stroke: #2f5a94; stroke-width: 2; }
    .pin { stroke: #2f5a94; stroke-width: 3; stroke-linecap: round; }
    .edge { stroke: #2b4f80; stroke-width: 1.5; }
    .neuron { fill: #3b82f6; animation: blink 3s ease-in-out infinite; }
    .neuron.d1 { animation-delay: .4s; } .neuron.d2 { animation-delay: .8s; }
    .neuron.d3 { animation-delay: 1.2s; } .neuron.d4 { animation-delay: 1.6s; }
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
    .stage { fill: #5b7aa6; font-size: 13px; letter-spacing: 2px; }
    @keyframes flow { to { stroke-dashoffset: 0; } }
    @keyframes blink { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .pulse, .neuron { animation: none; } .pulse { stroke-dashoffset: 0; } }
  </style>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)" opacity="0.6"/>
  <ellipse cx="600" cy="165" rx="420" ry="120" fill="url(#glow)"/>

  <!-- circuit traces: chip -> top/bottom rails -> neural net -->
  <path class="trace" d="M125 140 H190 V52 H1010 V140 H1060"/>
  <path class="trace" d="M125 180 H190 V268 H1010 V180 H1060"/>
  <path class="pulse" pathLength="1000" d="M125 140 H190 V52 H1010 V140 H1060"/>
  <path class="pulse b" pathLength="1000" d="M125 180 H190 V268 H1010 V180 H1060"/>
  <g class="via">
    <circle cx="190" cy="52" r="5"/><circle cx="420" cy="52" r="4"/><circle cx="780" cy="52" r="4"/><circle cx="1010" cy="52" r="5"/>
    <circle cx="190" cy="268" r="5"/><circle cx="420" cy="268" r="4"/><circle cx="780" cy="268" r="4"/><circle cx="1010" cy="268" r="5"/>
  </g>

  <!-- silicon: a little MCU -->
  <g>
    <line class="pin" x1="70" y1="117" x2="70" y2="125"/><line class="pin" x1="90" y1="117" x2="90" y2="125"/><line class="pin" x1="110" y1="117" x2="110" y2="125"/>
    <line class="pin" x1="70" y1="195" x2="70" y2="203"/><line class="pin" x1="90" y1="195" x2="90" y2="203"/><line class="pin" x1="110" y1="195" x2="110" y2="203"/>
    <line class="pin" x1="47" y1="140" x2="55" y2="140"/><line class="pin" x1="47" y1="160" x2="55" y2="160"/><line class="pin" x1="47" y1="180" x2="55" y2="180"/>
    <rect x="55" y="125" width="70" height="70" rx="8" fill="#111c2e" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="66" cy="136" r="3" fill="#3b82f6"/>
    <text x="90" y="165" text-anchor="middle" class="mono" font-size="14" fill="#9cc3ff">MCU</text>
  </g>
  <text x="90" y="228" text-anchor="middle" class="mono stage">SILICON</text>

  <!-- AI: a small neural net -->
  <g>
    <line class="edge" x1="1065" y1="140" x2="1110" y2="120"/><line class="edge" x1="1065" y1="140" x2="1110" y2="160"/><line class="edge" x1="1065" y1="140" x2="1110" y2="200"/>
    <line class="edge" x1="1065" y1="180" x2="1110" y2="120"/><line class="edge" x1="1065" y1="180" x2="1110" y2="160"/><line class="edge" x1="1065" y1="180" x2="1110" y2="200"/>
    <line class="edge" x1="1110" y1="120" x2="1155" y2="140"/><line class="edge" x1="1110" y1="160" x2="1155" y2="140"/><line class="edge" x1="1110" y1="200" x2="1155" y2="140"/>
    <line class="edge" x1="1110" y1="120" x2="1155" y2="180"/><line class="edge" x1="1110" y1="160" x2="1155" y2="180"/><line class="edge" x1="1110" y1="200" x2="1155" y2="180"/>
    <circle class="neuron" cx="1065" cy="140" r="7"/><circle class="neuron d1" cx="1065" cy="180" r="7"/>
    <circle class="neuron d2" cx="1110" cy="120" r="7"/><circle class="neuron d3" cx="1110" cy="160" r="7"/><circle class="neuron d4" cx="1110" cy="200" r="7"/>
    <circle class="neuron d1" cx="1155" cy="140" r="7"/><circle class="neuron d3" cx="1155" cy="180" r="7"/>
  </g>
  <text x="1110" y="228" text-anchor="middle" class="mono stage">AI</text>

  <!-- identity -->
  <text x="600" y="150" text-anchor="middle" class="sans" font-size="64" font-weight="700" fill="url(#name)" letter-spacing="1">Hosam Ayoub</text>
  <text x="600" y="192" text-anchor="middle" class="sans" font-size="23" fill="#c9d7ea">Software engineer who loves building solutions</text>
  <text x="600" y="232" text-anchor="middle" class="mono" font-size="17" fill="#7ee787">&gt; started with C on an ATmega32, now shipping .NET + LLMs</text>
</svg>
